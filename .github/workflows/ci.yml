name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AzToMarkdown.slnx

      - name: Build
        run: dotnet build AzToMarkdown.slnx --configuration Release --no-restore

      - name: Test shared template runtime
        run: dotnet test tests/AzResourceDetails.Templating.Tests --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

      - name: Test AzToMarkdown offline suite
        run: dotnet test tests/AzToMarkdown.Tests --configuration Release --no-build --no-restore --logger "console;verbosity=normal"
